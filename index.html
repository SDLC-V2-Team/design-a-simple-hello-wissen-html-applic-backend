<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Wissen</title>
  <style>
    /* Basic reset and centering */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 3rem 4rem;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    h1 {
      font-size: 3rem;
      font-weight: 600;
      margin-bottom: 1rem;
      letter-spacing: 2px;
    }
    .subtitle {
      font-size: 1.2rem;
      opacity: 0.9;
    }
    button {
      margin-top: 2rem;
      padding: 0.8rem 2rem;
      font-size: 1rem;
      border: none;
      border-radius: 50px;
      background: #ffffff;
      color: #764ba2;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="greeting">Hello Wissen</h1>
    <p class="subtitle">Your simple static HTML page</p>
    <button id="clickBtn">Click for a surprise</button>
    <p id="surprise" style="margin-top: 1rem; min-height: 1.5rem; font-style: italic;"></p>
  </div>

  <script>
    /**
     * Main interactivity for the Hello Wissen page.
     */
    const greetingEl = document.getElementById('greeting');
    const surpriseEl = document.getElementById('surprise');
    const btn = document.getElementById('clickBtn');

    let toggle = false;

    /**
     * Toggles the greeting text and shows a fun message.
     */
    function showMessage() {
      toggle = !toggle;
      if (toggle) {
        greetingEl.textContent = 'Hello Wissen (with a twist!)';
        surpriseEl.textContent = '✨ You clicked the button! Keep exploring. ✨';
        btn.textContent = 'Reset';
      } else {
        greetingEl.textContent = 'Hello Wissen';
        surpriseEl.textContent = '';
        btn.textContent = 'Click for a surprise';
      }
    }

    btn.addEventListener('click', showMessage);
  </script>
</body>
</html>
